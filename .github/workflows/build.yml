name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the texture engine
        run: python tests/test_texlib.py

      - name: Build exe
        run: pyinstaller --noconfirm ModTheShowManager.spec

      - name: Source zip
        shell: pwsh
        run: git archive --format=zip --prefix=ModTheShowManager-src/ -o dist/ModTheShowManager-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ModTheShowManager-windows
          path: |
            dist/ModTheShowManager.exe
            dist/ModTheShowManager-source.zip

      - name: Release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/ModTheShowManager.exe
            dist/ModTheShowManager-source.zip
