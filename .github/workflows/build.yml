name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Make a draft release with this tag (e.g. v0.10). Leave empty for a plain build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the texture engine
        run: python tests/test_texlib.py && python tests/test_modellib.py && python tests/test_rosters.py && python tests/test_codemods.py && python tests/test_mods.py

      - name: Fetch the audio decoder (vgmstream)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-win64.zip -OutFile vgm.zip
          Expand-Archive vgm.zip -DestinationPath vgm
          New-Item -ItemType Directory -Force src/modtheshow/assets/vgmstream | Out-Null
          Get-ChildItem vgm -Recurse -File | Where-Object { $_.Name -notmatch '^(in_|xmp-)' } |
            Copy-Item -Destination src/modtheshow/assets/vgmstream
          Get-ChildItem src/modtheshow/assets/vgmstream

      - name: Build exe
        run: pyinstaller --noconfirm ModTheShowManager.spec

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = (python -c "import sys; sys.path.insert(0, 'src'); import modtheshow; print(modtheshow.__version__)")
          & $iscc "/DAppVersion=$v" installer.iss

      - name: Source zip
        shell: pwsh
        run: git archive --format=zip --prefix=ModTheShowManager-src/ -o dist/ModTheShowManager-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ModTheShowManager-windows
          path: |
            dist/ModTheShowManager-Setup.exe
            dist/ModTheShowManager.exe
            dist/ModTheShowManager-source.zip

      - name: Patch notes for the draft
        id: notes
        shell: pwsh
        run: |
          $v = (python -c "import sys; sys.path.insert(0, 'src'); import modtheshow; print(modtheshow.__version__)")
          $f = "docs/PATCH-NOTES-$v.md"
          if (Test-Path $f) {
            # the title line is the release's name already
            (Get-Content $f | Select-Object -Skip 1) | Set-Content release-notes.md -Encoding utf8
          } else { Set-Content release-notes.md "" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release draft
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.draft != '' && inputs.draft || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mod the Show Manager ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/ModTheShowManager-Setup.exe
            dist/ModTheShowManager.exe
            dist/ModTheShowManager-source.zip
